
name: Build MiniLauncher APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Extract project
        run: unzip MiniLauncher.zip -d source

      - name: Build APK
        run: |
          cd source/MiniLauncher
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniLauncher-debug-apk
          path: source/MiniLauncher/app/build/outputs/apk/debug/app-debug.apk
